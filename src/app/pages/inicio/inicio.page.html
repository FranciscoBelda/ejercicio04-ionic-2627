<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Ejercicio 4</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <swiper-container [slidesPerView]="4.2">
    @for (category of categories; track category.category){
      <swiper-slide>
        <ion-button shape="round" [color]="category.color" (click)="changeCategory(category.category)">
          <ion-icon [name]="category.icon" slot="icon-only"></ion-icon>
        </ion-button>
      </swiper-slide>
    }
  </swiper-container>

  @if (!selectedCategory()){
    <h2 class="ion-text-center">Select a category</h2>
  } @else {
    <ion-list>
      @for (dataZelda of dataZeldaArrayShow(); track dataZelda.id){
        <ion-item-sliding>
          <ion-item>
            <ion-avatar slot="start">
              <img [src]="dataZelda.image" alt="">
            </ion-avatar>
            <ion-label><ion-text color="primary">{{dataZelda.name}}</ion-text> </ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="secondary" (click)="showToast(dataZelda.description)">
              <ion-icon name="information-circle-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  }

  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="dots" loadingText="Loading more..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
